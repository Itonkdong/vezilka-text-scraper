# Supported categories:
#   Архитектура, Астрономија, Биологија, Географија, Животни,
#   Земјоделство, Математика, Наука, Растенија, Технологија
# Use `categories: all` to scrape all supported categories.
categories:
  - all

recursive: true
max_depth: 2

total_article_limit: 1000
per_category_article_limit: null

include_redirects: false
namespace: 0
request_delay_seconds: 0.2
continue_on_error: true
batch_size: 32
output_run_name: null

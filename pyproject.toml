[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vezilka-text-scraper"
version = "0.1.0"
description = "Macedonian Wikipedia corpus builder for clean article text collection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "mwparserfromhell>=0.6.6,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    "pydantic>=2.8,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3,<4",
    "tqdm>=4.66,<5",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.scripts]
scrape-wikipedia = "vezilka_text_scraper.jobs.scrape:main"
clean-wikipedia = "vezilka_text_scraper.jobs.clean:main"
display-wikipedia = "vezilka_text_scraper.jobs.display:main"
persist-wikipedia = "vezilka_text_scraper.jobs.persist:main"
init-database = "vezilka_text_scraper.jobs.init_database:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "types-requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

services:
  postgres:
    image: postgres:16-alpine
    container_name: vezilka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vezilka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vezilka}
      POSTGRES_DB: ${POSTGRES_DATABASE:-vezilka}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vezilka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vezilka} -d ${POSTGRES_DATABASE:-vezilka}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vezilka_postgres_data:
